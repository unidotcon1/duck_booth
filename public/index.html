<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0e0e14">
  <title>photo buth</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <!-- LIVE SCREEN -->
  <main id="screen-live" class="screen">
    <section class="stage">
      <canvas id="preview" aria-label="Live camera preview"></canvas>
      <div id="countdown" class="countdown" hidden aria-live="assertive"></div>
      <div id="flash" class="flash" hidden></div>
      <div id="camera-error" class="camera-error" hidden role="alert"></div>
      <button id="shutter" class="shutter" type="button">📸 Take Picture</button>
    </section>

    <aside class="panel" aria-label="Settings">
      <h1>photo buth</h1>

      <label class="field">Mode
        <select id="mode">
          <option value="test">Testing — laptop webcam</option>
          <option value="prod">Production — Nikon DSLR (virtual webcam)</option>
        </select>
      </label>

      <label class="field">Camera
        <select id="camera"></select>
      </label>

      <fieldset class="field">
        <legend>Background</legend>
        <div id="bg-gallery" class="gallery" role="radiogroup" aria-label="Background"></div>
        <label class="file">＋ Custom image
          <input id="bg-file" type="file" accept="image/jpeg,image/png,image/webp">
        </label>
      </fieldset>

      <details class="field" open>
        <summary>Green-screen tuning</summary>
        <label>Key strength <input id="key-strength" type="range" min="0" max="100" value="50"></label>
        <label>Edge softness <input id="key-soft" type="range" min="5" max="80" value="45"></label>
        <label>Despill <input id="key-despill" type="range" min="0" max="100" value="80"></label>
      </details>

      <fieldset class="field">
        <legend>Event frame</legend>
        <label class="inline"><input id="frame-on" type="checkbox"> Show frame</label>
        <input id="frame-text" type="text" maxlength="40" placeholder="Event name" autocomplete="off">
        <label class="file">＋ Frame PNG (transparent)
          <input id="frame-file" type="file" accept="image/png">
        </label>
      </fieldset>

      <label class="inline"><input id="mirror" type="checkbox"> Mirror image</label>
      <button id="reset-token" class="link" type="button">Reset kiosk key</button>
    </aside>
  </main>

  <!-- RESULT SCREEN -->
  <main id="screen-result" class="screen result" hidden>
    <section class="result-photo"><img id="result-img" alt="Your photo"></section>
    <section class="result-side">
      <h2>Scan to download</h2>
      <div id="qr" class="qr" aria-live="polite"><p id="qr-status">Uploading…</p></div>
      <p id="qr-hint" class="hint"></p>
      <div class="row">
        <button id="retry" type="button" hidden>Retry upload</button>
        <button id="again" type="button" class="primary">Done — take another</button>
      </div>
    </section>
  </main>

  <div id="idle-warning" class="toast" hidden role="status">Still there? Resetting in <b id="idle-sec">20</b>s — tap to stay.</div>

  <dialog id="token-dialog">
    <form method="dialog" id="token-form">
      <h2>Kiosk key required</h2>
      <p>Paste the key set with <code>wrangler secret put KIOSK_TOKEN</code>. It is stored only on this device.</p>
      <input id="token-input" type="password" autocomplete="off" required>
      <button class="primary" type="submit">Save</button>
    </form>
  </dialog>

  <script src="/vendor/qrcode.js"></script>
  <script src="/app.js"></script>
</body>
</html>
